name: DreamHost RC validation

on:
  workflow_dispatch:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/dreamhost-rc.yml'
      - 'profiles/dreamhost-shared/**'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/dreamhost-rc.yml'
      - 'profiles/dreamhost-shared/**'

permissions:
  contents: read
  packages: write

env:
  WORDPRESS_RUNTIME_IMAGE: ghcr.io/thatismygithub/wp-dev-platform-wordpress:0.1.0-rc1
  HTTPD_RUNTIME_IMAGE: ghcr.io/thatismygithub/wp-dev-platform-httpd:0.1.0-rc1
  MYSQL_RUNTIME_IMAGE: ghcr.io/thatismygithub/wp-dev-platform-mysql:0.1.0-rc1

jobs:
  runtime-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: profiles/dreamhost-shared

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Prepare CI environment
        shell: bash
        run: |
          cp .env.example .env
          sed -i 's/^WPDEV_PROJECT_SLUG=.*/WPDEV_PROJECT_SLUG=wpdevci/' .env
          sed -i 's#^WP_URL=.*#WP_URL=http://web#' .env
          sed -i 's/^WP_DEBUG=.*/WP_DEBUG=false/' .env
          sed -i 's/^MYSQL_DATABASE=.*/MYSQL_DATABASE=wordpress_ci/' .env
          sed -i 's/^MYSQL_USER=.*/MYSQL_USER=wordpress_ci/' .env
          sed -i 's/^MYSQL_PASSWORD=.*/MYSQL_PASSWORD=ci-app-password-7c8e9f/' .env
          sed -i 's/^MYSQL_ROOT_PASSWORD=.*/MYSQL_ROOT_PASSWORD=ci-root-password-1a2b3c/' .env
          docker network inspect carida_cloudflare >/dev/null 2>&1 || docker network create carida_cloudflare
          docker compose version
          docker version

      - name: Validate deployment and build models
        run: |
          docker compose --env-file .env -f compose.yaml config -q
          docker compose --env-file .env -f compose.yaml -f compose.build.yaml config -q

      - name: Build RC images from source
        run: docker compose --env-file .env -f compose.yaml -f compose.build.yaml build --pull

      - name: Start runtime from deployment manifest
        run: |
          docker compose --env-file .env -f compose.yaml up -d
          docker compose --env-file .env -f compose.yaml up -d --wait --wait-timeout 180
          docker compose --env-file .env -f compose.yaml ps

      - name: Install WordPress
        run: |
          docker compose --env-file .env -f compose.yaml --profile tools run --rm -T wpcli \
            core install \
            --url=http://web \
            --title='wp-dev-platform CI' \
            --admin_user=ciadmin \
            --admin_password='ci-only-password-42!' \
            --admin_email=ci@example.invalid \
            --skip-email
          docker compose --env-file .env -f compose.yaml --profile tools run --rm -T wpcli core version

      - name: Run compatibility doctor
        run: bash scripts/doctor.sh

      - name: Prove Apache permalinks and uploaded media
        shell: bash
        run: |
          set -euo pipefail

          docker compose --env-file .env -f compose.yaml --profile tools run --rm -T wpcli \
            rewrite structure '/%postname%/'

          docker compose --env-file .env -f compose.yaml --profile tools run --rm -T wpcli \
            post create \
            --post_type=post \
            --post_status=publish \
            --post_title='CI Permalink Fixture' \
            --post_name='ci-permalink-fixture' \
            --post_content='WPDEV_PERMALINK_HTTP_OK'

          PERMALINK_STATUS="$(docker compose --env-file .env -f compose.yaml exec -T wordpress \
            curl -sS -o /dev/null -w '%{http_code}' http://web/ci-permalink-fixture/)"
          test "$PERMALINK_STATUS" = "200"

          printf '%s' 'iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAusB9Y9ZQmcAAAAASUVORK5CYII=' | base64 -d > /tmp/wpdev-ci.png
          docker compose --env-file .env -f compose.yaml cp /tmp/wpdev-ci.png wordpress:/var/www/html/wpdev-ci.png

          ATTACHMENT_ID="$(docker compose --env-file .env -f compose.yaml --profile tools run --rm -T wpcli \
            media import /var/www/html/wpdev-ci.png --title='CI media fixture' --porcelain | tr -d '\r')"
          test -n "$ATTACHMENT_ID"

          docker compose --env-file .env -f compose.yaml --profile tools run --rm -T wpcli \
            option update wpdev_ci_attachment_id "$ATTACHMENT_ID"

          MEDIA_PATH="$(docker compose --env-file .env -f compose.yaml --profile tools run --rm -T wpcli \
            post meta get "$ATTACHMENT_ID" _wp_attached_file | tr -d '\r')"
          test -n "$MEDIA_PATH"

          MEDIA_STATUS="$(docker compose --env-file .env -f compose.yaml exec -T wordpress \
            curl -sS -o /dev/null -w '%{http_code}' "http://web/wp-content/uploads/$MEDIA_PATH")"
          test "$MEDIA_STATUS" = "200"

          docker compose --env-file .env -f compose.yaml exec -T wordpress rm -f /var/www/html/wpdev-ci.png

      - name: Verify restart persistence
        shell: bash
        run: |
          set -euo pipefail
          docker compose --env-file .env -f compose.yaml restart db wordpress web
          docker compose --env-file .env -f compose.yaml up -d --wait --wait-timeout 180
          docker compose --env-file .env -f compose.yaml --profile tools run --rm -T wpcli core is-installed
          docker compose --env-file .env -f compose.yaml --profile tools run --rm -T wpcli option get siteurl

          PERMALINK_STATUS="$(docker compose --env-file .env -f compose.yaml exec -T wordpress \
            curl -sS -o /dev/null -w '%{http_code}' http://web/ci-permalink-fixture/)"
          test "$PERMALINK_STATUS" = "200"

          ATTACHMENT_ID="$(docker compose --env-file .env -f compose.yaml --profile tools run --rm -T wpcli \
            option get wpdev_ci_attachment_id | tr -d '\r')"
          test -n "$ATTACHMENT_ID"

          MEDIA_PATH="$(docker compose --env-file .env -f compose.yaml --profile tools run --rm -T wpcli \
            post meta get "$ATTACHMENT_ID" _wp_attached_file | tr -d '\r')"
          test -n "$MEDIA_PATH"

          MEDIA_STATUS="$(docker compose --env-file .env -f compose.yaml exec -T wordpress \
            curl -sS -o /dev/null -w '%{http_code}' "http://web/wp-content/uploads/$MEDIA_PATH")"
          test "$MEDIA_STATUS" = "200"

      - name: Database export/import dry run
        shell: bash
        run: |
          bash scripts/db-export.sh backups/ci-roundtrip.sql
          test -s backups/ci-roundtrip.sql
          CONFIRM_IMPORT=1 bash scripts/db-import.sh backups/ci-roundtrip.sql
          docker compose --env-file .env -f compose.yaml --profile tools run --rm -T wpcli core is-installed

      - name: Final doctor
        run: bash scripts/doctor.sh

      - name: Diagnostics on failure
        if: failure()
        run: |
          docker compose --env-file .env -f compose.yaml ps || true
          docker compose --env-file .env -f compose.yaml logs --no-color --tail=250 || true

      - name: Tear down
        if: always()
        run: |
          docker compose --env-file .env -f compose.yaml down -v --remove-orphans || true
          docker network rm carida_cloudflare >/dev/null 2>&1 || true

  publish-runtime-images:
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    needs: runtime-validation
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish WordPress/PHP runtime
        uses: docker/build-push-action@v6
        with:
          context: profiles/dreamhost-shared
          file: profiles/dreamhost-shared/wordpress/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.WORDPRESS_RUNTIME_IMAGE }}
          labels: |
            org.opencontainers.image.source=https://github.com/ThatisMyGitHub/wp-dev-platform
            org.opencontainers.image.version=0.1.0-rc1
            org.opencontainers.image.description=DreamHost-compatible WordPress/PHP runtime for wp-dev-platform
          build-args: |
            WORDPRESS_BASE_IMAGE=wordpress:7.0.4-php8.3-fpm@sha256:48fd4f0fee04801b95245c39d6ad915491ef00c943c8c359b1ea552e1647a18e
            WP_CLI_VERSION=2.12.0
            PHP_BUILD_JOBS=1
          cache-from: type=gha,scope=wordpress-runtime
          cache-to: type=gha,mode=max,scope=wordpress-runtime

      - name: Publish Apache runtime
        uses: docker/build-push-action@v6
        with:
          context: profiles/dreamhost-shared
          file: profiles/dreamhost-shared/apache/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.HTTPD_RUNTIME_IMAGE }}
          labels: |
            org.opencontainers.image.source=https://github.com/ThatisMyGitHub/wp-dev-platform
            org.opencontainers.image.version=0.1.0-rc1
            org.opencontainers.image.description=Apache FastCGI frontend for wp-dev-platform
          build-args: |
            HTTPD_BASE_IMAGE=httpd:2.4.68@sha256:2920ed8587277d6aa8ea785e143e970835057123dc7bf1199d102c60c80a73bb
          cache-from: type=gha,scope=httpd-runtime
          cache-to: type=gha,mode=max,scope=httpd-runtime

      - name: Publish MySQL runtime
        uses: docker/build-push-action@v6
        with:
          context: profiles/dreamhost-shared
          file: profiles/dreamhost-shared/mysql/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.MYSQL_RUNTIME_IMAGE }}
          labels: |
            org.opencontainers.image.source=https://github.com/ThatisMyGitHub/wp-dev-platform
            org.opencontainers.image.version=0.1.0-rc1
            org.opencontainers.image.description=DreamHost-compatible MySQL runtime for wp-dev-platform
          build-args: |
            MYSQL_BASE_IMAGE=mysql:8.0.41@sha256:bf577825b52ab281d6281fb281eabbfdc73507eda8f2c2745790251533ef0306
          cache-from: type=gha,scope=mysql-runtime
          cache-to: type=gha,mode=max,scope=mysql-runtime
