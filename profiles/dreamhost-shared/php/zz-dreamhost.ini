; DreamHost Shared measured web-runtime compatibility baseline.
; Production reference: PHP 8.3.30 / cgi-fcgi.

memory_limit = 128M
max_execution_time = 120
max_input_time = -1
max_input_vars = 3000
post_max_size = 512M
upload_max_filesize = 512M
max_file_uploads = 20
default_socket_timeout = 60

; DreamHost web runtime reported OPcache enabled.
opcache.enable = 1

; Keep CLI behavior practical for WP-CLI without changing web limits.
opcache.enable_cli = 1
