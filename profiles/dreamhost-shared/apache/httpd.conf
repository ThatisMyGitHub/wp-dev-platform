ServerRoot "/usr/local/apache2"
Listen 80

LoadModule mpm_event_module modules/mod_mpm_event.so
LoadModule authn_core_module modules/mod_authn_core.so
LoadModule authz_core_module modules/mod_authz_core.so
LoadModule authz_host_module modules/mod_authz_host.so
LoadModule authz_user_module modules/mod_authz_user.so
LoadModule dir_module modules/mod_dir.so
LoadModule env_module modules/mod_env.so
LoadModule headers_module modules/mod_headers.so
LoadModule log_config_module modules/mod_log_config.so
LoadModule mime_module modules/mod_mime.so
LoadModule proxy_module modules/mod_proxy.so
LoadModule proxy_fcgi_module modules/mod_proxy_fcgi.so
LoadModule rewrite_module modules/mod_rewrite.so
LoadModule setenvif_module modules/mod_setenvif.so
LoadModule unixd_module modules/mod_unixd.so

ServerAdmin webmaster@localhost
ServerName localhost

# The official httpd image runs as Debian's www-data account.
User www-data
Group www-data

ErrorLog /proc/self/fd/2
LogLevel warn
LogFormat "%h %l %u %t \"%r\" %>s %b \"%{Referer}i\" \"%{User-Agent}i\"" combined
CustomLog /proc/self/fd/1 combined

TypesConfig conf/mime.types
DirectoryIndex index.php index.html

DocumentRoot "/var/www/html"
<Directory "/var/www/html">
    Options FollowSymLinks
    AllowOverride All
    Require all granted
</Directory>

# Use a backend-only alias rather than the generic Compose service name
# `wordpress`. The Apache container is attached to both the private backend and
# the shared carida_cloudflare network; another stack can legitimately expose a
# `wordpress` alias on that shared network. A dedicated backend alias prevents
# Docker embedded DNS from selecting an unrelated container.
<FilesMatch "\.php$">
    SetHandler "proxy:fcgi://wpdev-php-backend:9000"
</FilesMatch>

# Do not expose dotfiles other than .well-known resources.
<FilesMatch "^\.(?!well-known)">
    Require all denied
</FilesMatch>
